# VCTN Alembic configuration.
# Spec 07 s1: Migration uses Alembic. Spec 13 s3: migrations must be reviewable.
#
# NOTE: keep this file ASCII-only. On Windows, configparser reads .ini files with
# the locale codec (GBK) by default, so non-ASCII comments break `alembic` CLI.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The database URL is injected by alembic/env.py from application settings.
# It is intentionally left empty here so credentials never enter the VCS
# (Spec 13 s2).
sqlalchemy.url =

# Timestamped revision filenames keep the history readable and sortable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
