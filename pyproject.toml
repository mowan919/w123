[project]
name = "vctn"
version = "0.1.0"
description = "VCTN 后台管理平台 — Phase 1 工程基线"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    # 口令哈希（Spec 04 §2 / 10 §1：argon2id）。
    # 2026-09-24 补齐：此依赖此前只在 venv 中存在、未写入 pyproject，
    # 会导致全新环境部署后 `import app.core.security.password` 直接失败。
    "argon2-cffi==25.1.0",
    # MFA Secret 的 AEAD 加解密（DD-22 / Spec 04 §6「Secret 必须加密保存」）。
    # 由 OpenSSL 支撑的对称加密实现，不自研 AES-GCM。
    "cryptography==46.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# pytest
# Spec 12 §1 Test Layers
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: 单元测试 (Spec 12 §1 Unit)",
    "integration: 集成测试 (Spec 12 §1 Integration)",
    "security: 安全测试 (Spec 12 §1 Security)",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]
# Alembic 迁移脚本由 alembic 模板生成（含上游固定的文件名 / 注释格式），
# 不参与 lint 以满足模板一致性；其内容审查由 Spec 13 §3 的 migration review 承担。
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "S101",    # 测试中允许 assert
    "RUF001",  # 中文全角标点：本项目注释 / 文档使用中文，属噪声
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
