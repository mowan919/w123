# ===========================================================================
# VCTN 开发环境 —— PostgreSQL + Redis
#
# 说明：
# - 本文件不参与本地应用运行（本地开发直连现有数据库地址，无需 Docker）。
#   它的用途是：为需要一次性拉起依赖的场景、以及部署环境提供标准定义。
# - 镜像版本属于 DD-18（PostgreSQL / Redis 版本尚未冻结），
#   因此通过环境变量可覆盖，默认值仅为临时可用值，不得视为最终需求。
# ===========================================================================

name: vctn

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: vctn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vctn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-vctn}
      # Spec 00 §6：时间统一 UTC
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vctn} -d ${POSTGRES_DB:-vctn}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vctn

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: vctn-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    environment:
      TZ: UTC
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vctn

  # 应用容器：仅在显式启用 profile 时启动，本地开发不需要。
  #   docker compose --profile app up -d
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vctn-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vctn

volumes:
  postgres_data:
  redis_data:

networks:
  vctn:
    driver: bridge
